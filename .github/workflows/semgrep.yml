name: Semgrep source review

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Run Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Validate custom rule files
        run: |
          for rule in semgrep-rules/*.yaml; do
            echo "Validating $rule"
            semgrep --validate --config "$rule"
          done

      - name: Scan with custom rules and baseline rules
        run: |
          semgrep scan --metrics=off \
            --config p/default \
            --config semgrep-rules/01-hardcoded-secrets.yaml \
            --config semgrep-rules/02-hardcoded-elements.yaml \
            --config semgrep-rules/03-information-disclosure.yaml \
            --config semgrep-rules/04-sensitive-data.yaml \
            --config semgrep-rules/05-injection-taint.yaml \
            --config semgrep-rules/06-misconfig-crypto-auth.yaml \
            --config semgrep-rules/07-code-hygiene.yaml \
            .
