rules:
  - id: aws-access-key
    languages: [generic]
    severity: ERROR
    message: Possible AWS access key ID hardcoded.
    pattern-regex: '\b(AKIA|ASIA)[0-9A-Z]{16}\b'
    metadata: {cwe: ["CWE-798"], owasp: ["A07:2021"]}

  - id: private-key-block
    languages: [generic]
    severity: ERROR
    message: Private key material committed to source.
    pattern-regex: '-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----'
    metadata: {cwe: ["CWE-321"], owasp: ["A02:2021"]}

  - id: github-token
    languages: [generic]
    severity: ERROR
    message: GitHub token hardcoded.
    pattern-regex: '\bgh[pousr]_[A-Za-z0-9]{36,}\b'
    metadata: {cwe: ["CWE-798"]}

  - id: google-api-key
    languages: [generic]
    severity: ERROR
    message: Google API key hardcoded.
    pattern-regex: '\bAIza[0-9A-Za-z_\-]{35}\b'
    metadata: {cwe: ["CWE-798"]}

  - id: slack-token
    languages: [generic]
    severity: ERROR
    message: Slack token hardcoded.
    pattern-regex: '\bxox[baprs]-[0-9A-Za-z\-]{10,}\b'
    metadata: {cwe: ["CWE-798"]}

  - id: stripe-live-key
    languages: [generic]
    severity: ERROR
    message: Stripe live secret key hardcoded.
    pattern-regex: '\b[sr]k_live_[0-9a-zA-Z]{24,}\b'
    metadata: {cwe: ["CWE-798"]}

  - id: jwt-token-literal
    languages: [generic]
    severity: WARNING
    message: Hardcoded JWT found.
    pattern-regex: '\beyJ[A-Za-z0-9_\-]{10,}\.eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}'
    metadata: {cwe: ["CWE-798"]}

  - id: db-connection-string-with-creds
    languages: [generic]
    severity: ERROR
    message: Connection string contains embedded credentials.
    pattern-regex: '(?i)\b(mongodb(\+srv)?|postgres(ql)?|mysql|redis|amqps?|mssql)://[^:\s/"'']+:[^@\s"'']+@'
    metadata: {cwe: ["CWE-798", "CWE-259"]}

  - id: hardcoded-credential-assignment
    languages: [generic]
    severity: ERROR
    message: Hardcoded password/secret/token assigned to a variable or config key.
    patterns:
      - pattern-regex: '(?i)\b[\w.\-]*(password|passwd|pwd|secret|api[_-]?key|access[_-]?key|auth[_-]?token|client[_-]?secret|private[_-]?key)[\w.\-]*["'']?\s*[:=]\s*["''][^"''\s]{6,}["'']'
      - pattern-not-regex: '(?i)(example|changeme|change_me|your[_-]|xxx+|dummy|sample|placeholder|<[^>]+>|\$\{|%\(|process\.env|getenv|os\.environ|\*{3,})'
    metadata: {cwe: ["CWE-798", "CWE-259"], owasp: ["A07:2021"]}

  - id: basic-auth-header-hardcoded
    languages: [generic]
    severity: WARNING
    message: Hardcoded Basic/Bearer authorization header.
    pattern-regex: '(?i)authorization["'']?\s*[:=,]\s*["''](basic|bearer)\s+[A-Za-z0-9+/=_\-\.]{12,}'
    metadata: {cwe: ["CWE-798"]}
